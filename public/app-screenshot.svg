<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Montserrat, Roboto, system-ui, sans-serif" role="img" aria-label="Dashboard da plataforma de gestão de testes e qualidade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#478ac9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#478ac9"/>
    </linearGradient>
    <linearGradient id="barHi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFC400" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#478ac9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#478ac9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- ============ SIDEBAR ============ -->
  <rect x="0" y="0" width="230" height="1000" fill="#0e1626"/>
  <rect x="229" y="0" width="1" height="1000" fill="#ffffff" opacity="0.06"/>
  <!-- marca -->
  <circle cx="46" cy="52" r="16" fill="#FFC400"/>
  <rect x="72" y="44" width="96" height="16" rx="8" fill="#ffffff" opacity="0.85"/>
  <!-- itens de nav -->
  <rect x="20" y="120" width="190" height="44" rx="12" fill="#478ac9" opacity="0.16"/>
  <rect x="36" y="136" width="16" height="12" rx="3" fill="#478ac9"/>
  <rect x="66" y="135" width="120" height="14" rx="7" fill="#cfe0f2" opacity="0.9"/>
  <g fill="#7f8ba3">
    <rect x="36" y="196" width="16" height="12" rx="3"/><rect x="66" y="195" width="110" height="14" rx="7" opacity="0.5"/>
    <rect x="36" y="248" width="16" height="12" rx="3"/><rect x="66" y="247" width="132" height="14" rx="7" opacity="0.5"/>
    <rect x="36" y="300" width="16" height="12" rx="3"/><rect x="66" y="299" width="96" height="14" rx="7" opacity="0.5"/>
    <rect x="36" y="352" width="16" height="12" rx="3"/><rect x="66" y="351" width="124" height="14" rx="7" opacity="0.5"/>
    <rect x="36" y="404" width="16" height="12" rx="3"/><rect x="66" y="403" width="88" height="14" rx="7" opacity="0.5"/>
  </g>

  <!-- ============ TOPO ============ -->
  <text x="270" y="62" fill="#ffffff" font-size="30" font-weight="700">Painel de Qualidade</text>
  <text x="270" y="90" fill="#8fa0bd" font-size="16">Visão geral · últimos 7 dias</text>
  <!-- busca -->
  <rect x="1120" y="36" width="300" height="44" rx="22" fill="#ffffff" opacity="0.06"/>
  <circle cx="1150" cy="58" r="8" fill="none" stroke="#8fa0bd" stroke-width="3"/>
  <line x1="1156" y1="64" x2="1163" y2="71" stroke="#8fa0bd" stroke-width="3" stroke-linecap="round"/>
  <text x="1176" y="64" fill="#8fa0bd" font-size="15">Buscar suíte, caso, execução…</text>
  <!-- avatar -->
  <circle cx="1470" cy="58" r="24" fill="#478ac9"/>
  <text x="1470" y="65" fill="#0b1220" font-size="18" font-weight="700" text-anchor="middle">TC</text>

  <!-- ============ KPIs ============ -->
  <!-- card 1 -->
  <g>
    <rect x="270" y="120" width="290" height="150" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="294" y="158" fill="#8fa0bd" font-size="15">Testes executados</text>
    <text x="294" y="212" fill="#ffffff" font-size="44" font-weight="800">12.480</text>
    <rect x="294" y="230" width="66" height="24" rx="12" fill="#3ecf8e" opacity="0.15"/>
    <text x="306" y="247" fill="#3ecf8e" font-size="14" font-weight="700">+8,2%</text>
  </g>
  <!-- card 2 -->
  <g>
    <rect x="580" y="120" width="290" height="150" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="604" y="158" fill="#8fa0bd" font-size="15">Taxa de aprovação</text>
    <text x="604" y="212" fill="#3ecf8e" font-size="44" font-weight="800">98,2%</text>
    <rect x="604" y="230" width="66" height="24" rx="12" fill="#3ecf8e" opacity="0.15"/>
    <text x="616" y="247" fill="#3ecf8e" font-size="14" font-weight="700">+1,4%</text>
  </g>
  <!-- card 3 -->
  <g>
    <rect x="890" y="120" width="290" height="150" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="914" y="158" fill="#8fa0bd" font-size="15">Cobertura de código</text>
    <text x="914" y="212" fill="#ffffff" font-size="44" font-weight="800">87%</text>
    <rect x="914" y="236" width="242" height="10" rx="5" fill="#ffffff" opacity="0.08"/>
    <rect x="914" y="236" width="210" height="10" rx="5" fill="#478ac9"/>
  </g>
  <!-- card 4 -->
  <g>
    <rect x="1200" y="120" width="220" height="150" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="1224" y="158" fill="#8fa0bd" font-size="15">Bugs críticos</text>
    <text x="1224" y="212" fill="#FFC400" font-size="44" font-weight="800">3</text>
    <rect x="1224" y="230" width="86" height="24" rx="12" fill="#db545a" opacity="0.16"/>
    <text x="1236" y="247" fill="#db545a" font-size="14" font-weight="700">2 abertos</text>
  </g>

  <!-- ============ GRÁFICO DE BARRAS ============ -->
  <rect x="270" y="300" width="600" height="330" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="298" y="342" fill="#ffffff" font-size="20" font-weight="700">Execuções por dia</text>
  <text x="298" y="368" fill="#8fa0bd" font-size="14">Aprovados vs. reprovados</text>
  <!-- baseline -->
  <line x1="298" y1="580" x2="842" y2="580" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <!-- barras (baseline y=580) -->
  <g>
    <rect x="312" y="470" width="46" height="110" rx="6" fill="url(#bar)"/>
    <rect x="386" y="440" width="46" height="140" rx="6" fill="url(#bar)"/>
    <rect x="460" y="500" width="46" height="80"  rx="6" fill="url(#bar)"/>
    <rect x="534" y="420" width="46" height="160" rx="6" fill="url(#bar)"/>
    <rect x="608" y="392" width="46" height="188" rx="6" fill="url(#bar)"/>
    <rect x="682" y="452" width="46" height="128" rx="6" fill="url(#bar)"/>
    <rect x="756" y="360" width="46" height="220" rx="6" fill="url(#barHi)"/>
  </g>
  <g fill="#7f8ba3" font-size="13" text-anchor="middle">
    <text x="335" y="604">Seg</text>
    <text x="409" y="604">Ter</text>
    <text x="483" y="604">Qua</text>
    <text x="557" y="604">Qui</text>
    <text x="631" y="604">Sex</text>
    <text x="705" y="604">Sáb</text>
    <text x="779" y="604">Dom</text>
  </g>

  <!-- ============ DONUT DE APROVAÇÃO ============ -->
  <rect x="890" y="300" width="530" height="330" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="918" y="342" fill="#ffffff" font-size="20" font-weight="700">Resultado geral</text>
  <!-- track -->
  <circle cx="1035" cy="480" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="26"/>
  <!-- 98,2% aprovado (verde) — dash sobre circunferência ~578 -->
  <circle cx="1035" cy="480" r="92" fill="none" stroke="#3ecf8e" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="567 11" stroke-dashoffset="0" transform="rotate(-90 1035 480)"/>
  <text x="1035" y="474" fill="#ffffff" font-size="42" font-weight="800" text-anchor="middle">98,2%</text>
  <text x="1035" y="504" fill="#8fa0bd" font-size="15" text-anchor="middle">aprovação</text>
  <!-- legenda -->
  <g font-size="15">
    <circle cx="1200" cy="432" r="7" fill="#3ecf8e"/>
    <text x="1218" y="437" fill="#cfe0f2">Aprovados</text>
    <text x="1392" y="437" fill="#ffffff" font-weight="700" text-anchor="end">12.256</text>
    <circle cx="1200" cy="480" r="7" fill="#db545a"/>
    <text x="1218" y="485" fill="#cfe0f2">Reprovados</text>
    <text x="1392" y="485" fill="#ffffff" font-weight="700" text-anchor="end">198</text>
    <circle cx="1200" cy="528" r="7" fill="#FFC400"/>
    <text x="1218" y="533" fill="#cfe0f2">Instáveis</text>
    <text x="1392" y="533" fill="#ffffff" font-weight="700" text-anchor="end">26</text>
  </g>

  <!-- ============ TABELA DE EXECUÇÕES ============ -->
  <rect x="270" y="662" width="1150" height="300" rx="18" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="298" y="704" fill="#ffffff" font-size="20" font-weight="700">Execuções recentes</text>
  <!-- cabeçalho -->
  <g fill="#7f8ba3" font-size="13" font-weight="700" letter-spacing="1">
    <text x="298" y="742">SUÍTE</text>
    <text x="720" y="742">AMBIENTE</text>
    <text x="960" y="742">DURAÇÃO</text>
    <text x="1392" y="742" text-anchor="end">STATUS</text>
  </g>
  <line x1="298" y1="756" x2="1392" y2="756" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- linha 1 -->
  <text x="298" y="800" fill="#e7eefb" font-size="16">Checkout · API E2E</text>
  <text x="720" y="800" fill="#8fa0bd" font-size="15">Produção</text>
  <text x="960" y="800" fill="#8fa0bd" font-size="15">2m 14s</text>
  <rect x="1300" y="784" width="92" height="26" rx="13" fill="#3ecf8e" opacity="0.15"/>
  <text x="1346" y="801" fill="#3ecf8e" font-size="13" font-weight="700" text-anchor="middle">Passou</text>
  <line x1="298" y1="822" x2="1392" y2="822" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- linha 2 -->
  <text x="298" y="856" fill="#e7eefb" font-size="16">Login · Regressão UI</text>
  <text x="720" y="856" fill="#8fa0bd" font-size="15">Homologação</text>
  <text x="960" y="856" fill="#8fa0bd" font-size="15">5m 03s</text>
  <rect x="1300" y="840" width="92" height="26" rx="13" fill="#3ecf8e" opacity="0.15"/>
  <text x="1346" y="857" fill="#3ecf8e" font-size="13" font-weight="700" text-anchor="middle">Passou</text>
  <line x1="298" y1="878" x2="1392" y2="878" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- linha 3 -->
  <text x="298" y="912" fill="#e7eefb" font-size="16">Pagamentos · Segurança</text>
  <text x="720" y="912" fill="#8fa0bd" font-size="15">Produção</text>
  <text x="960" y="912" fill="#8fa0bd" font-size="15">8m 41s</text>
  <rect x="1290" y="896" width="102" height="26" rx="13" fill="#db545a" opacity="0.16"/>
  <text x="1341" y="913" fill="#db545a" font-size="13" font-weight="700" text-anchor="middle">Falhou · 2</text>
</svg>
